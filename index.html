<title>পরমাণুর গঠন - ৫০টি MCQ (৮ম শ্রেণি)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:'SutonnyOMJ';
  src:local('SutonnyOMJ'), local('SutonnyOMJ Regular'), url('SutonnyOMJ.ttf') format('truetype');
  font-weight:normal;font-style:normal;
}
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#1e293b;
  font-family:'SutonnyOMJ','Noto Sans Bengali',sans-serif;font-size:19px;line-height:1.7}
header{background:#1d4ed8;color:#fff;padding:18px 16px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;font-size:16px;opacity:.95}
#score{font-weight:bold}
main{max-width:820px;margin:20px auto;padding:0 14px 60px}
.card{background:#fff;border-radius:12px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.qn{font-weight:bold;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#f8fafc;border:2px solid #cbd5e1;border-radius:8px;padding:9px 14px;margin:7px 0;cursor:pointer;transition:.15s}
.opt:hover:not([disabled]){border-color:#1d4ed8;background:#eff6ff}
.opt[disabled]{cursor:default}
.opt.correct{background:#dcfce7;border-color:#16a34a;color:#14532d;font-weight:bold}
.opt.wrong{background:#fee2e2;border-color:#dc2626;color:#7f1d1d;font-weight:bold}
.fb{margin-top:10px;padding:10px 14px;border-radius:8px;display:none;font-size:18px}
.fb.ok{display:block;background:#f0fdf4;border-left:5px solid #16a34a}
.fb.no{display:block;background:#fef2f2;border-left:5px solid #dc2626}
#result{display:none;text-align:center;background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
#result h2{margin:0 0 8px}
button.reset{font:inherit;background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:10px 22px;cursor:pointer;margin-top:10px}
</style>

<script>
// প্রতিটি প্রশ্নে: q = প্রশ্ন, o = অপশন (প্রথমটি সঠিক উত্তর, লোড হওয়ার সময় এলোমেলো হবে), e = ব্যাখ্যা
const DATA = [
{q:"কোনো মৌলের পরমাণুতে ১৭টি প্রোটন ও ১৮টি নিউট্রন আছে। এর ভরসংখ্যা কত?",o:["৩৫","১৭","১৮","৫২"],e:"ভরসংখ্যা = প্রোটন + নিউট্রন = ১৭ + ১৮ = ৩৫।"},
{q:"পরমাণুর প্রায় সম্পূর্ণ ভর কোথায় কেন্দ্রীভূত থাকে?",o:["নিউক্লিয়াসে","ইলেকট্রনের কক্ষপথে","নিউক্লিয়াস ও কক্ষপথের মধ্যবর্তী ফাঁকা স্থানে","সব কক্ষপথে সমানভাবে"],e:"ইলেকট্রনের ভর নগণ্য, তাই প্রোটন ও নিউট্রন থাকা নিউক্লিয়াসেই প্রায় সব ভর থাকে।"},
{q:"গ্রিক দার্শনিক ডেমোক্রিটাস কখন পদার্থের ক্ষুদ্রতম কণা নিয়ে সর্বপ্রথম মতবাদ দেন?",o:["খ্রিষ্টপূর্ব ৪০০ অব্দে","১৮০৩ সালে","খ্রিষ্টপূর্ব ১৮০৩ অব্দে","খ্রিষ্টপূর্ব ৫০ অব্দে"],e:"ডেমোক্রিটাস খ্রিষ্টপূর্ব ৪০০ অব্দে মতবাদ দেন; ১৮০৩ সালে জন ডাল্টন তাঁর পরমাণুবাদ দেন।"},
{q:"'এটম' শব্দটি যে গ্রিক শব্দ 'এটোমোস' থেকে এসেছে, তার অর্থ কী?",o:["অবিভাজ্য","ক্ষুদ্রতম","নিরবচ্ছিন্ন","আধানযুক্ত"],e:"এটোমোস মানে অবিভাজ্য, অর্থাৎ যাকে আর ভাঙা যায় না।"},
{q:"অ্যারিস্টটলের মতে পদার্থ কেমন?",o:["নিরবচ্ছিন্ন, যতই ভাঙা হোক কণা ক্ষুদ্র থেকে ক্ষুদ্রতর হতে থাকবে","অবিভাজ্য কণা দ্বারা গঠিত","শুধু ইলেকট্রন দ্বারা গঠিত","নিউক্লিয়াস ও কক্ষপথ নিয়ে গঠিত"],e:"অ্যারিস্টটল ডেমোক্রিটাসের মতের বিরোধী ছিলেন এবং পদার্থকে নিরবচ্ছিন্ন বলেছিলেন।"},
{q:"ডাল্টনের পরমাণুবাদের প্রধান সীমাবদ্ধতা কোনটি?",o:["পরমাণু অবিভাজ্য নয়, এটি ইলেকট্রন, প্রোটন ও নিউট্রনে গঠিত","পরমাণু মৌলের ক্ষুদ্রতম কণা বলা","পরমাণুর ভর আছে বলা","পরমাণু বিক্রিয়ায় অংশ নেয় বলা"],e:"ডাল্টন পরমাণুকে অবিভাজ্য বলেছিলেন, কিন্তু পরে দেখা গেছে পরমাণু বিভাজ্য।"},
{q:"রাদারফোর্ড ও বোরের মডেলের মূল পার্থক্য কোনটি?",o:["রাদারফোর্ড নির্দিষ্ট কক্ষপথের কথা বলেননি, বোর নির্দিষ্ট কক্ষপথের কথা বলেছেন","রাদারফোর্ড নিউক্লিয়াস মানেননি, বোর মেনেছেন","বোর পরমাণুকে অবিভাজ্য বলেছেন","রাদারফোর্ড ইলেকট্রনকে ধনাত্মক বলেছেন"],e:"রাদারফোর্ডের মডেল সৌরজগতের মতো হলেও নির্দিষ্ট কক্ষপথ ছিল না; বোর নির্দিষ্ট কক্ষপথের ধারণা দেন।"},
{q:"সোডিয়ামের পারমাণবিক সংখ্যা ১১ ও ভরসংখ্যা ২৩ হলে এর একটি পরমাণুতে নিউট্রন কয়টি?",o:["১২","১১","২৩","৩৪"],e:"নিউট্রন = ভরসংখ্যা − পারমাণবিক সংখ্যা = ২৩ − ১১ = ১২।"},
{q:"একটি পরমাণুতে ১৩টি ইলেকট্রন এবং ভরসংখ্যা ২৭। এতে নিউট্রন কয়টি?",o:["১৪","১৩","২৭","৪০"],e:"পরমাণু আধান নিরপেক্ষ, তাই প্রোটন = ইলেকট্রন = ১৩। নিউট্রন = ২৭ − ১৩ = ১৪।"},
{q:"শুধু পারমাণবিক সংখ্যা জানলে নিচের কোনটি নিশ্চিতভাবে জানা যায় না?",o:["নিউট্রনের সংখ্যা","প্রোটনের সংখ্যা","আধান নিরপেক্ষ পরমাণুর ইলেকট্রনের সংখ্যা","মৌলটি কোনটি"],e:"নিউট্রন সংখ্যা জানতে ভরসংখ্যাও লাগে।"},
{q:"সূত্র 2n² অনুযায়ী তৃতীয় কক্ষপথে সর্বোচ্চ কয়টি ইলেকট্রন থাকতে পারে?",o:["১৮","৮","৯","২৭"],e:"n = ৩ হলে 2n² = ২ × ৯ = ১৮।"},
{q:"সূত্র 2n² অনুযায়ী চতুর্থ কক্ষপথে সর্বোচ্চ কয়টি ইলেকট্রন থাকতে পারে?",o:["৩২","১৮","১৬","৬৪"],e:"n = ৪ হলে 2n² = ২ × ১৬ = ৩২।"},
{q:"ক্লোরিনের ইলেকট্রন বিন্যাস ২,৮,৭। স্থিতিশীল হতে হলে এটি সাধারণত কী করবে?",o:["১টি ইলেকট্রন গ্রহণ করবে","৭টি ইলেকট্রন বর্জন করবে","১টি ইলেকট্রন বর্জন করবে","২টি ইলেকট্রন গ্রহণ করবে"],e:"১টি ইলেকট্রন নিলে শেষ কক্ষপথে ৮টি হয়, যা সহজ ও স্থিতিশীল।"},
{q:"ম্যাগনেসিয়ামের (পারমাণবিক সংখ্যা ১২) ইলেকট্রন বিন্যাস কোনটি?",o:["২,৮,২","২,৮,১","২,১০","২,২,৮"],e:"১২টি ইলেকট্রন: প্রথমে ২, তারপর ৮, বাকি ২টি তৃতীয় কক্ষপথে।"},
{q:"সিলিকনের (পারমাণবিক সংখ্যা ১৪) ইলেকট্রন বিন্যাস কোনটি?",o:["২,৮,৪","২,৪,৮","২,৬,৬","২,৮,৩"],e:"১৪ = ২ + ৮ + ৪।"},
{q:"সালফারের (পারমাণবিক সংখ্যা ১৬) শেষ কক্ষপথে কয়টি ইলেকট্রন থাকে?",o:["৬","৮","১৬","৪"],e:"সালফারের বিন্যাস ২,৮,৬।"},
{q:"আর্গনের (পারমাণবিক সংখ্যা ১৮) ইলেকট্রন বিন্যাস ২,৮,৮। কোন যুক্তি সবচেয়ে সঠিক?",o:["শেষ কক্ষপথে ৮টি ইলেকট্রন থাকায় এটি স্থিতিশীল ও নিষ্ক্রিয়","শেষ কক্ষপথে ১৮টি ইলেকট্রন থাকায় এটি স্থিতিশীল","শেষ কক্ষপথ ফাঁকা বলে এটি নিষ্ক্রিয়","এর নিউট্রন নেই বলে এটি নিষ্ক্রিয়"],e:"শেষ কক্ষপথে ৮টি ইলেকট্রন (বইয়ের ভাষায় স্থিতিশীল অবস্থা) থাকায় আর্গন নিষ্ক্রিয়।"},
{q:"নিয়নের (পারমাণবিক সংখ্যা ১০) ইলেকট্রন বিন্যাস কোনটি?",o:["২,৮","২,৮,১০","১০","২,২,৬"],e:"১০ = ২ + ৮; দ্বিতীয় কক্ষপথ পূর্ণ, তাই নিয়ন নিষ্ক্রিয়।"},
{q:"ফসফরাসের (পারমাণবিক সংখ্যা ১৫) ইলেকট্রন বিন্যাস কোনটি?",o:["২,৮,৫","২,৫,৮","২,৮,৭","২,৭,৬"],e:"১৫ = ২ + ৮ + ৫।"},
{q:"অ্যালুমিনিয়ামের (পারমাণবিক সংখ্যা ১৩) তৃতীয় কক্ষপথে কয়টি ইলেকট্রন থাকে?",o:["৩","২","১৩","৫"],e:"বিন্যাস ২,৮,৩।"},
{q:"বেরিলিয়ামের (পারমাণবিক সংখ্যা ৪) ইলেকট্রন বিন্যাস কোনটি?",o:["২,২","৪","২,১,১","১,৩"],e:"প্রথম কক্ষপথে সর্বোচ্চ ২টি; বাকি ২টি দ্বিতীয় কক্ষপথে।"},
{q:"বোরনের (পারমাণবিক সংখ্যা ৫) ইলেকট্রন বিন্যাস কোনটি?",o:["২,৩","৩,২","২,২,১","৫"],e:"২টি প্রথম কক্ষপথে, বাকি ৩টি দ্বিতীয় কক্ষপথে।"},
{q:"হাইড্রোজেনের কোন আইসোটোপে ২টি নিউট্রন থাকে?",o:["ট্রিটিয়াম","প্রোটিয়াম","ডিউটেরিয়াম","হিলিয়াম"],e:"ট্রিটিয়ামের ভরসংখ্যা ৩; ১টি প্রোটন + ২টি নিউট্রন।"},
{q:"ডিউটেরিয়ামের ভরসংখ্যা ২ হলে এর নিউট্রন সংখ্যা কত?",o:["১","২","০","৩"],e:"হাইড্রোজেনের প্রোটন ১টি, তাই নিউট্রন = ২ − ১ = ১।"},
{q:"কোনটি আইসোটোপের সঠিক সংজ্ঞা?",o:["একই মৌলের যেসব পরমাণুর পারমাণবিক সংখ্যা সমান কিন্তু ভরসংখ্যা ভিন্ন","যেসব পরমাণুর ভরসংখ্যা সমান কিন্তু পারমাণবিক সংখ্যা ভিন্ন","যেসব পরমাণুতে ইলেকট্রন ও নিউট্রন সমান","যেসব আয়নের আধান সমান"],e:"প্রোটন সংখ্যা সমান কিন্তু নিউট্রন ভিন্ন হওয়ায় ভরসংখ্যা ভিন্ন হয়।"},
{q:"নিচের কোন জোড়া একই মৌলের আইসোটোপ? (প্রোটন, নিউট্রন)",o:["(৬,৬) ও (৬,৮)","(৬,৬) ও (৭,৭)","(৮,৮) ও (৭,৮)","(১১,১২) ও (১২,১২)"],e:"আইসোটোপে প্রোটন সংখ্যা সমান থাকে (এখানে দুটোতেই ৬), নিউট্রন ভিন্ন।"},
{q:"একই মৌলের আইসোটোপগুলোর রাসায়নিক ধর্মে তেমন পার্থক্য থাকে না কেন?",o:["ইলেকট্রন ও প্রোটন সংখ্যা সমান বলে","নিউট্রন সংখ্যা সমান বলে","ভরসংখ্যা সমান বলে","সবগুলোই তেজস্ক্রিয় বলে"],e:"রাসায়নিক ধর্ম মূলত ইলেকট্রন বিন্যাসের ওপর নির্ভর করে, যা আইসোটোপে একই।"},
{q:"আইসোটোপগুলোকে সহজেই শনাক্ত করা যায় কেন?",o:["তাদের ভর আলাদা বলে","তাদের রাসায়নিক ধর্ম আলাদা বলে","তাদের ইলেকট্রন সংখ্যা আলাদা বলে","তাদের পারমাণবিক সংখ্যা আলাদা বলে"],e:"নিউট্রন সংখ্যা ভিন্ন হওয়ায় ভর ভিন্ন, ফলে ভরের মাধ্যমে চেনা যায়।"},
{q:"কিছু আইসোটোপকে 'তেজস্ক্রিয় আইসোটোপ' বলা হয় কেন?",o:["এরা অস্থায়ী ও তেজস্ক্রিয় রশ্মি-কণা বিকিরণ করে","এদের প্রোটন নেই","এদের ভর সবচেয়ে কম","এরা সবসময় আধানযুক্ত"],e:"অস্থায়ী আইসোটোপ বিভিন্ন তেজস্ক্রিয় রশ্মি ও কণা বিকিরণ করে।"},
{q:"ফসিলের বয়স নির্ণয়ে বিজ্ঞানীরা কোন তথ্য কাজে লাগান?",o:["ফসিলে স্থায়ী ও অস্থায়ী আইসোটোপের অনুপাত","ফসিলের রং","ফসিলের মধ্যে ইলেকট্রনের সংখ্যা","ফসিলের আকার"],e:"অস্থায়ী আইসোটোপের ক্ষয়ের কারণে স্থায়ী-অস্থায়ীর অনুপাত থেকে বয়স জানা যায়।"},
{q:"নিচের কোন কাজটি তেজস্ক্রিয় রশ্মির জীবাণু ধ্বংসের ধর্মের ওপর নির্ভরশীল?",o:["ডাক্তারি যন্ত্রপাতি জীবাণুমুক্ত করা","ফসিলের বয়স নির্ণয়","জমিতে সারের পরিমাণ নির্ণয়","রক্তনালির ক্ষত শনাক্ত করা"],e:"তেজস্ক্রিয় রশ্মি জীবাণু মেরে ফেলে, তাই যন্ত্রপাতি জীবাণুমুক্ত করা যায়।"},
{q:"সোডিয়াম পরমাণু ১টি ইলেকট্রন হারালে কী ঘটে?",o:["+১ আধানযুক্ত ক্যাটায়নে পরিণত হয়","−১ আধানযুক্ত অ্যানায়নে পরিণত হয়","আধান নিরপেক্ষই থাকে","প্রোটন সংখ্যা কমে যায়"],e:"ইলেকট্রন (ঋণাত্মক) কমে গেলে ধনাত্মক আধান বেশি হয়, তাই ক্যাটায়ন তৈরি হয়।"},
{q:"Na⁺ আয়নে প্রোটন ও ইলেকট্রনের সংখ্যা যথাক্রমে কত? (Na-এর পারমাণবিক সংখ্যা ১১)",o:["১১ ও ১০","১০ ও ১১","১১ ও ১২","১২ ও ১১"],e:"আয়ন তৈরিতে প্রোটন বদলায় না (১১); ইলেকট্রন ১টি কমে ১০ হয়।"},
{q:"ফ্লোরিনের ইলেকট্রন বিন্যাস ২,৭। F⁻ আয়নে মোট ইলেকট্রন কয়টি?",o:["১০","৮","৯","৭"],e:"ফ্লোরিন পরমাণুতে ৯টি ইলেকট্রন; ১টি গ্রহণ করে F⁻-এ হয় ১০টি (বিন্যাস ২,৮)।"},
{q:"ফ্লোরিন পরমাণু ৭টি ইলেকট্রন বর্জন না করে ১টি গ্রহণ করে কেন?",o:["১টি গ্রহণে দ্বিতীয় কক্ষপথ ৮টিতে পূর্ণ হয়, আর ৭টি বর্জন করা বেশ কঠিন","ফ্লোরিনে নিউট্রন বেশি বলে","ফ্লোরিনে প্রোটন কম বলে","ফ্লোরিন আধান নিরপেক্ষ থাকতে চায় বলে"],e:"বইয়ের যুক্তি: ৭টি ইলেকট্রন দেওয়া কঠিন; ১টি পেলে ২,৮ বিন্যাস পায়।"},
{q:"Mg পরমাণু (২,৮,২) ২টি ইলেকট্রন হারালে যে আয়ন তৈরি হয়, তার আধান ও বিন্যাস কী?",o:["+২ ও ২,৮","−২ ও ২,৮,৪","+২ ও ২,৮,২","+১ ও ২,৮,১"],e:"২টি ইলেকট্রন হারালে +২ আধান; ইলেকট্রন ১০টি, বিন্যাস ২,৮।"},
{q:"Cl⁻ আয়নের (Cl-এর বিন্যাস ২,৮,৭) ইলেকট্রন বিন্যাস কোনটি?",o:["২,৮,৮","২,৮,৭","২,৮,৬","২,৮"],e:"১টি ইলেকট্রন গ্রহণ করে তৃতীয় কক্ষপথে ৮টি হয়।"},
{q:"NaF যৌগে Na⁺ ও F⁻ পরস্পরের সাথে যুক্ত থাকে কেন?",o:["বিপরীত আধানের মধ্যে বৈদ্যুতিক আকর্ষণ বলের কারণে","দুটোই ধনাত্মক বলে","নিউট্রনের আকর্ষণের কারণে","দুটোই আধান নিরপেক্ষ বলে"],e:"ধনাত্মক ও ঋণাত্মক আয়নের মধ্যে আকর্ষণ বল কাজ করে।"},
{q:"পরমাণু আধান নিরপেক্ষ হওয়ার কারণ কী?",o:["প্রোটন ও ইলেকট্রনের সংখ্যা সমান","নিউট্রনের আধান নেই","ইলেকট্রনের সংখ্যা নিউট্রনের সমান","প্রোটনের সংখ্যা নিউট্রনের সমান"],e:"সমান সংখ্যক ধনাত্মক ও ঋণাত্মক আধান একে অপরকে বাতিল করে।"},
{q:"ক্লোরিনের পারমাণবিক সংখ্যা ১৭ ও ভরসংখ্যা ৩৫। নিউট্রন সংখ্যা ও ইলেকট্রন সংখ্যার পার্থক্য কত?",o:["১","০","১৮","১৭"],e:"নিউট্রন = ৩৫ − ১৭ = ১৮; ইলেকট্রন = ১৭; পার্থক্য = ১।"},
{q:"অক্সিজেনের (প্রোটন ৮) একটি আইসোটোপে ১০টি নিউট্রন আছে। এর ভরসংখ্যা কত?",o:["১৮","১৬","১০","২৬"],e:"৮ + ১০ = ১৮।"},
{q:"একটি আয়নে ৮টি প্রোটন ও ১০টি ইলেকট্রন আছে। আয়নটির আধান কত?",o:["−২","+২","−১","০"],e:"ইলেকট্রন ২টি বেশি, তাই −২ আধান (অ্যানায়ন)।"},
{q:"একটি আয়নে ১২টি প্রোটন ও ১০টি ইলেকট্রন আছে। এটি কী ধরনের আয়ন?",o:["+২ আধানযুক্ত ক্যাটায়ন","−২ আধানযুক্ত অ্যানায়ন","+১ আধানযুক্ত ক্যাটায়ন","আধান নিরপেক্ষ পরমাণু"],e:"প্রোটন ২টি বেশি হওয়ায় ধনাত্মক আধান +২; তাই ক্যাটায়ন।"},
{q:"কার্বনের যে আইসোটোপে ৮টি নিউট্রন আছে, তার ভরসংখ্যা কত?",o:["১৪","১২","১৩","৮"],e:"কার্বনের প্রোটন ৬; ৬ + ৮ = ১৪।"},
{q:"'পরমাণুর বেশিরভাগ জায়গা ফাঁকা'—এর সঠিক ব্যাখ্যা কোনটি?",o:["ইলেকট্রন ও নিউক্লিয়াসের মধ্যবর্তী জায়গা ফাঁকা","নিউক্লিয়াসের ভেতরটা ফাঁকা","পরমাণুতে কোনো কণাই নেই","প্রোটন ও নিউট্রনের মধ্যে ফাঁকা জায়গা বেশি"],e:"ক্ষুদ্র নিউক্লিয়াস কেন্দ্রে, ইলেকট্রন ঘুরছে অনেক দূরে—মাঝের অংশ ফাঁকা।"},
{q:"সোডিয়াম পরমাণু (২,৮,১) বেশ সক্রিয় ও খুব স্থিতিশীল নয় কেন?",o:["তৃতীয় কক্ষপথে মাত্র ১টি ইলেকট্রন আছে","দ্বিতীয় কক্ষপথ পূর্ণ নয়","প্রথম কক্ষপথে ২টির বেশি ইলেকট্রন আছে","এতে প্রোটন কম"],e:"১টি ইলেকট্রন দিয়ে দিলে ২,৮ বিন্যাস পেয়ে স্থিতিশীল হতে পারে, তাই এটি সক্রিয়।"},
{q:"রাদারফোর্ডের পরমাণু মডেলকে কিসের সাথে তুলনা করা হয়?",o:["সৌরজগতের সাথে","একটি কঠিন গোলকের সাথে","একটি ফাঁকা বেলুনের সাথে","একটি জমাট ডিমের সাথে"],e:"কেন্দ্রে নিউক্লিয়াস (সূর্য), চারদিকে ইলেকট্রন (গ্রহ)—তাই সৌরজগতের মতো।"},
{q:"লিথিয়াম পরমাণুর তৃতীয় ইলেকট্রনটি প্রথম কক্ষপথে না থেকে দ্বিতীয় কক্ষপথে থাকে কেন?",o:["প্রথম কক্ষপথে সর্বোচ্চ ২টি ইলেকট্রন থাকতে পারে","প্রথম কক্ষপথে কেবল ১টি ইলেকট্রন থাকতে পারে","দ্বিতীয় কক্ষপথ আগে পূর্ণ হয়","তৃতীয় ইলেকট্রনটি নিউট্রনে পরিণত হয়"],e:"2n² সূত্রে n = ১ হলে সর্বোচ্চ ২টি; তাই লিথিয়ামের বিন্যাস ২,১।"},
{q:"কার্বনের (পারমাণবিক সংখ্যা ৬) বিন্যাস অনুযায়ী শেষ কক্ষপথে কয়টি ইলেকট্রন আছে?",o:["৪","৬","২","৮"],e:"কার্বনের বিন্যাস ২,৪।"},
{q:"হিলিয়াম পরমাণু (২টি ইলেকট্রন) স্থিতিশীল ও নিষ্ক্রিয় হওয়ার কারণ কী?",o:["প্রথম কক্ষপথে সর্বোচ্চ ২টি ইলেকট্রন থাকতে পারে এবং তা পূর্ণ","শেষ কক্ষপথে ৮টি ইলেকট্রন আছে","এতে নিউট্রন নেই","এটি আধানযুক্ত"],e:"হিলিয়ামের একমাত্র কক্ষপথ ২টি ইলেকট্রনে পূর্ণ, তাই এটি স্থিতিশীল।"}
];

const quizEl = document.getElementById('quiz');
const toBn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
let score = 0, answered = 0;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function render(){
  score = 0; answered = 0; quizEl.innerHTML = '';
  document.getElementById('result').style.display = 'none';
  update();
  DATA.forEach((d, i) => {
    const card = document.createElement('div'); card.className = 'card';
    const correct = d.o[0];
    const opts = shuffle(d.o.slice());
    const labels = ['ক','খ','গ','ঘ'];
    card.innerHTML = `<div class="qn">${toBn(i+1)}। ${d.q}</div>`;
    const btns = opts.map((t, k) => {
      const b = document.createElement('button'); b.className = 'opt';
      b.textContent = `${labels[k]}) ${t}`; b.dataset.t = t; card.appendChild(b); return b;
    });
    const fb = document.createElement('div'); fb.className = 'fb'; card.appendChild(fb);
    btns.forEach(b => b.addEventListener('click', () => {
      btns.forEach(x => x.disabled = true);
      answered++;
      if (b.dataset.t === correct) {
        b.classList.add('correct'); score++;
        fb.className = 'fb ok'; fb.innerHTML = `✅ <b>সঠিক!</b> ${d.e}`;
      } else {
        b.classList.add('wrong');
        btns.find(x => x.dataset.t === correct).classList.add('correct');
        fb.className = 'fb no'; fb.innerHTML = `❌ <b>ভুল!</b> সঠিক উত্তর: <b>${correct}</b><br>${d.e}`;
      }
      update();
      if (answered === DATA.length) showResult();
    }));
    quizEl.appendChild(card);
  });
}
function update(){
  document.getElementById('done').textContent = toBn(answered);
  document.getElementById('score').textContent = toBn(score);
}
function showResult(){
  const r = document.getElementById('result');
  const pct = Math.round(score / DATA.length * 100);
  let msg = pct >= 80 ? 'অসাধারণ! 🎉' : pct >= 60 ? 'ভালো হয়েছে, আরও একটু অনুশীলন করো।' : 'আবার পড়ে চেষ্টা করো, তুমি পারবে!';
  r.innerHTML = `<h2>ফলাফল: ${toBn(score)} / ${toBn(DATA.length)} (${toBn(pct)}%)</h2><p>${msg}</p><button class="reset" onclick="render();window.scrollTo(0,0)">আবার শুরু করো</button>`;
  r.style.display = 'block';
  r.scrollIntoView({behavior:'smooth'});
}
render();
</script>
